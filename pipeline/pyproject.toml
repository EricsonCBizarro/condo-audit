[project]
name = "condo-audit-pipeline"
version = "0.1.0"
description = "Document processing and audit rules engine for condo-audit."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "jsonschema>=4.23",
    "pillow>=11.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymupdf>=1.25",
    "pytesseract>=0.3.13",
    "redis>=5.2",
    "reportlab>=4.2",
    "structlog>=24.4",
    "typer>=0.15",
]

[project.scripts]
condo-audit = "condo_audit.cli:app"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.35",
    "hypothesis>=6.120",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/condo_audit"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "RET", "PL", "S", "DTZ"]
ignore = ["E501", "PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "S311"]
# Synthetic data uses seeded PRNGs on purpose (reproducible output, no secrets).
"src/condo_audit/synth/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["condo_audit"]

[[tool.mypy.overrides]]
# PyMuPDF's bundled hints are incomplete; treat these libraries as untyped.
module = ["pymupdf", "pymupdf.*", "pytesseract", "reportlab.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs PostgreSQL, Redis and object storage (docker compose up)",
    "ocr: needs the tesseract binary",
]

[tool.coverage.run]
source = ["condo_audit"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
